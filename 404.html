<!doctype html>
<!--
  =====================================================================
    404 PAGE  (404.html)
  =====================================================================
    Shows up when someone types a wrong address or clicks a broken
    link (e.g. stephypak.com/oops). GitHub Pages finds this file on
    its own because it's called 404.html and sits in the main folder.

    IMPORTANT: every link and file path on this page starts with "/"
    (e.g. /styles/style.css), not "./". This page can appear at ANY
    address, like stephypak.com/a/b/c, so paths have to start from
    the main folder to work.
    (Live Server tip: to preview it, open localhost:5500/404.html,
    or type a fake address like localhost:5500/oops.)

    ✏️ = things you'll want to edit
  =====================================================================
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Stephy Pak</title>
    <!-- Keeps Google from listing this page in search results -->
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/assets/favicon/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />

    <link rel="stylesheet" href="/styles/style.css" />
  </head>

  <body class="work-page lost-page">

    <!-- Floating name, same as every page -->
    <header class="project-header">
      <a href="/" class="project-header-name">Stephy Pak</a>
    </header>

    <main class="lost">
      <!-- ✏️ The big line — a twist on the homepage slogan.
           The pink comma is its own <span>, like on the homepage. -->
      <h1 class="hero-slogan lost-slogan">
        <span class="hero-slogan-line">pretty lost.</span>
        <span class="hero-slogan-line hero-slogan-indent">pretty<span class="hero-comma">,</span> lost.</span>
      </h1>

      <!-- ✏️ The small note underneath -->
      <p class="lost-note">
        <span class="lost-code">Error 404</span>
        This page wandered off. Probably following the music.<br />
        Let's get you somewhere good:
      </p>

      <ul class="lost-links">
        <li><a href="/">← Home</a></li>
        <li><a href="/#works-heading">Selected work</a></li>
        <li><a href="/play.html">Peek</a></li>
        <li><a href="mailto:stephypak@gmail.com">Say hi</a></li>
      </ul>
    </main>

  </body>
</html>
