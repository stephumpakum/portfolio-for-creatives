<!doctype html>
<!--
  =====================================================================
    PROJECT PAGE 4 — DEEP BREAKFAST  (deep-breakfast.html)
  =====================================================================
    All four project pages are built the same way, so once you know
    one, you know them all.

    WHAT'S IN HERE (top to bottom)
    ---------------------------------------------------------------
    1. FLOATING NAME ..... "Stephy Pak" — goes back to the homepage
    2. HERO IMAGE ........ first big image                        ✏️
    3. BRIEF + CREDITS ... short description + role, year, etc.   ✏️
    4. MORE IMAGES ....... full-width, two side by side, full-width ✏️
    5. NEXT PROJECT ...... link to the next page

    ✏️ = things you'll want to edit
    Anything in [square brackets] is a placeholder — replace it.

    ADDING YOUR IMAGES
      1. Put the image file in the  assets/projects/  folder
         (simple names work best: booth-fest-01.jpg — no spaces).
      2. Change  src="assets/projects/poster.jpg"  (the stand-in image)
         to      src="assets/projects/booth-fest-01.jpg"
      3. Change the alt="…" text to a short description of the image
         (screen readers read this out loud for people who can't see it).
  =====================================================================
-->
<html lang="en">
  <head>
    <!-- charset first: tells the browser how to read the letters (é, —, etc.) -->
    <meta charset="utf-8" />
    <!-- Makes the site fit phone screens properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✏️ SEO: the TITLE is the blue link in Google + the browser tab text.
         Aim for under 60 characters: what it is, then your name. -->
    <title>Deep Breakfast — Art Book &amp; CD Packaging | Stephy Pak</title>
    <!-- ✏️ SEO: the DESCRIPTION is the grey text under that link in Google.
         Aim for 120–160 characters. Every page gets its own. -->
    <meta name="description" content="A printed art book and CD package reimagining Ray Lynch's album Deep Breakfast, with spreads built from network maps of its sounds. By Stephy Pak." />
    <!-- Tells Google the one "official" address of this page -->
    <link rel="canonical" href="https://stephypak.com/deep-breakfast.html" />

    <!-- FAVICON (the little icon in the browser tab) — one line per browser type:
           .svg = modern browsers (stays sharp at any size)
           .png = browsers that can't use SVG (16px tab + 32px for sharp screens)
           .ico = very old browsers (it sits in the main folder, where they look for it)
           apple-touch-icon = when someone saves your site to an iPhone home screen -->
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./assets/favicon/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />

    <!-- Connects your style file -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body class="project-page">

    <!-- =================================================================
         1. FLOATING NAME
         Stays in the corner as you scroll. Clicking it goes back to the
         top of the homepage.
         ================================================================= -->
    <header class="project-header">
      <a href="index.html#top" class="project-header-name">Stephy Pak</a>
    </header>

    <main class="project">

      <!-- ===============================================================
           2. HERO IMAGE — your strongest image of this project ✏️
           =============================================================== -->
      <figure class="project-figure">
        <img src="assets/projects/poster.jpg" width="1553" height="2400" loading="eager" alt="And that is not all: typographic poster with layered browser warning windows, halftone dots and figures" />
      </figure>

      <!-- ===============================================================
           3. BRIEF + CREDITS ✏️
           Brief: 2–3 sentences. Credits: each <div> is one row.
           To add a row, copy a whole  <div class="project-credit">…</div>  line.
           To remove one, delete its line.
           =============================================================== -->
      <section class="project-about" aria-label="About this project">
        <p class="project-brief">[Two or three sentences on the brief: what Deep Breakfast is and what you set out to make.]</p>
        <dl class="project-credits">
          <div class="project-credit"><dt>Project</dt><dd>Deep Breakfast</dd></div>
          <div class="project-credit"><dt>Role</dt><dd>Designer</dd></div>
          <div class="project-credit"><dt>Context</dt><dd>Mentorship project</dd></div>
          <div class="project-credit"><dt>Mentor</dt><dd>Dominic Prevost, Executive Creative Director, Resonance</dd></div>
          <div class="project-credit"><dt>Year</dt><dd>[Year]</dd></div>
        </dl>
      </section>

      <!-- ===============================================================
           4. MORE IMAGES ✏️
           Each <figure> … </figure> is one image.
             • copy a figure block to add an image
             • delete a figure block to remove one
             • <figcaption> is an optional caption — delete it if you don't want one
           =============================================================== -->

      <!-- Full-width image -->
      <figure class="project-figure">
        <img src="assets/projects/poster.jpg" width="1553" height="2400" loading="lazy" alt="And that is not all: typographic poster with layered browser warning windows, halftone dots and figures" />
        <figcaption>[Optional caption]</figcaption>
      </figure>

      <!-- Two images side by side (they stack on phones) -->
      <div class="project-pair">
        <figure class="project-figure">
          <img src="assets/projects/poster.jpg" width="1553" height="2400" loading="lazy" alt="And that is not all: typographic poster with layered browser warning windows, halftone dots and figures" />
        </figure>
        <figure class="project-figure">
          <img src="assets/projects/poster.jpg" width="1553" height="2400" loading="lazy" alt="And that is not all: typographic poster with layered browser warning windows, halftone dots and figures" />
        </figure>
      </div>

      <!-- Full-width image -->
      <figure class="project-figure">
        <img src="assets/projects/poster.jpg" width="1553" height="2400" loading="lazy" alt="And that is not all: typographic poster with layered browser warning windows, halftone dots and figures" />
      </figure>

    </main>

    <!-- =================================================================
         5. NEXT PROJECT
         Left: back to the work list. Right: the next project's page.
         (The pages loop: 1 → 2 → 3 → 4 → back to 1.)
         ================================================================= -->
    <footer class="project-footer">
      <a href="index.html#works-heading" class="project-back">← All work</a>
      <a href="booth-fest.html" class="project-next">
        <span class="project-next-label">Next</span>
        <span class="project-next-title">Booth Fest →</span>
      </a>
    </footer>

  </body>
</html>
